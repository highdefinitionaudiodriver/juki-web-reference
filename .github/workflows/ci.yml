name: resident-record-ci

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  web-and-node:
    name: Web + Node API
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Generate OpenAPI types
        run: npm run generate:openapi

      - name: TypeScript + Node check
        run: npm run check

      - name: Web unit tests (Vitest)
        run: npm run web:test

      - name: Node API smoke
        run: npm run smoke

      - name: Node API E2E (Playwright)
        run: npm run e2e:api

      - name: Build web
        run: npm run web:build

      - name: Install Chromium for a11y E2E
        run: npm run e2e:install

      - name: Accessibility E2E (axe-core)
        run: npm run e2e:a11y

      - name: Upload Playwright report (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-node
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7

  spring:
    name: Spring Boot + Testcontainers
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: microsoft
          java-version: "21"
          cache: maven

      # ubuntu-latest にはデフォルトで Docker が利用可能なので、
      # Testcontainers の PostgreSQL コンテナがそのまま起動する
      - name: Verify Docker available
        run: docker info

      - name: Spring unit + integration tests
        working-directory: apps/api-spring
        run: mvn -B test

      - name: Upload Surefire reports (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: apps/api-spring/target/surefire-reports/
          if-no-files-found: ignore
          retention-days: 7

  openapi-diff:
    name: OpenAPI diff (spec ⇔ Spring runtime)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: resident
          POSTGRES_USER: resident
          POSTGRES_PASSWORD: resident
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U resident -d resident"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: microsoft
          java-version: "21"
          cache: maven

      - name: Install Node dependencies
        run: npm ci

      - name: Build Spring jar
        working-directory: apps/api-spring
        run: mvn -B -DskipTests package

      - name: Start Spring API in background
        working-directory: apps/api-spring
        env:
          DB_URL: jdbc:postgresql://localhost:5432/resident
          DB_USER: resident
          DB_PASSWORD: resident
          # ci プロファイル: 認可を無効化（CiSecurityConfig）。JWKS 取得もスキップ。
          # /v3/api-docs を取得するためだけの最小構成。
          SPRING_PROFILES_ACTIVE: ci
        run: |
          nohup java -jar target/*.jar --spring.profiles.active=ci > spring.log 2>&1 &
          echo $! > spring.pid

      - name: Wait for Spring API
        run: npx wait-on -t 180000 http://localhost:8788/v3/api-docs http://localhost:8788/actuator/health

      - name: Run OpenAPI diff
        run: npm run openapi:diff -- --spring http://localhost:8788/v3/api-docs --spec c_openapi.yaml

      - name: Show Spring log on failure
        if: failure()
        run: cat apps/api-spring/spring.log || true

      - name: Stop Spring
        if: always()
        run: |
          if [ -f apps/api-spring/spring.pid ]; then
            kill "$(cat apps/api-spring/spring.pid)" || true
          fi

      - name: Upload Spring log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: spring-openapi-diff-log
          path: apps/api-spring/spring.log
          if-no-files-found: ignore
          retention-days: 7

  pdfa-verify:
    name: PDF/A veraPDF
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: resident
          POSTGRES_USER: resident
          POSTGRES_PASSWORD: resident
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U resident -d resident"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Spring PDF/A image
        run: docker build -t resident-record-api:pdfa apps/api-spring

      - name: Start Spring API
        run: |
          docker run -d \
            --name resident-record-api-pdfa \
            --network host \
            -e SPRING_PROFILES_ACTIVE=ci \
            -e DB_URL=jdbc:postgresql://localhost:5432/resident \
            -e DB_USER=resident \
            -e DB_PASSWORD=resident \
            -e CERT_PDF_A=true \
            resident-record-api:pdfa

      - name: Wait for Spring API
        run: |
          for i in {1..60}; do
            if curl -fsS http://localhost:8788/actuator/health >/dev/null; then
              exit 0
            fi
            sleep 3
          done
          docker logs resident-record-api-pdfa || true
          exit 1

      - name: Install psql client
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends postgresql-client

      - name: Seed certificate fixture
        env:
          PGPASSWORD: resident
        run: |
          # heredoc 経由の docker run では multibyte / 改行が壊れることがあったため、
          # runner 上の psql で SQL ファイルを直接実行する。
          psql -h localhost -U resident -d resident -v ON_ERROR_STOP=1 \
            -f .github/ci-seed/pdfa-fixture.sql

      - name: Issue certificate and download PDF
        run: |
          mkdir -p artifacts/pdfa
          curl -fsS \
            -H "Content-Type: application/json" \
            -d '{"residentId":"R-PDFA","formId":"0010001","copies":1,"usageText":"PDF/A CI"}' \
            http://localhost:8788/api/v1/certificates/jumin > artifacts/pdfa/issue.json
          ISSUE_ID="$(python3 -c "import json; print(json.load(open('artifacts/pdfa/issue.json'))['issueId'])")"
          curl -fsS \
            "http://localhost:8788/api/v1/certificates/${ISSUE_ID}/pdf" \
            -o "artifacts/pdfa/certificate-${ISSUE_ID}.pdf"
          echo "PDF_PATH=artifacts/pdfa/certificate-${ISSUE_ID}.pdf" >> "$GITHUB_ENV"

      - name: Run veraPDF
        run: |
          docker run --rm \
            -v "${{ github.workspace }}/artifacts/pdfa:/work" \
            ghcr.io/verapdf/verapdf:latest \
            --format xml "/work/$(basename "$PDF_PATH")" | tee artifacts/pdfa/verapdf.xml
          grep -q "<isCompliant>true</isCompliant>" artifacts/pdfa/verapdf.xml

      - name: Show Spring log on failure
        if: failure()
        run: docker logs resident-record-api-pdfa || true

      - name: Stop Spring API
        if: always()
        run: docker rm -f resident-record-api-pdfa || true

      - name: Upload PDF/A artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pdfa-verification
          path: artifacts/pdfa/
          if-no-files-found: ignore
          retention-days: 7

  spring-oidc-e2e:
    name: Spring OIDC E2E (Keycloak)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: microsoft
          java-version: "21"
          cache: maven

      - name: Install Node dependencies
        run: npm ci

      - name: Start PostgreSQL and Keycloak
        run: docker compose -f apps/api-spring/docker-compose.yaml up -d postgres keycloak

      - name: Wait for Keycloak realm
        run: |
          for i in {1..80}; do
            if curl -fsS http://localhost:8080/realms/juki/.well-known/openid-configuration >/dev/null; then
              exit 0
            fi
            sleep 3
          done
          docker logs resident-keycloak || true
          exit 1

      - name: Build Spring jar
        working-directory: apps/api-spring
        run: mvn -B -DskipTests package

      - name: Start Spring API with Keycloak issuer
        working-directory: apps/api-spring
        env:
          DB_URL: jdbc:postgresql://localhost:5432/resident
          DB_USER: resident
          DB_PASSWORD: resident
          OIDC_ISSUER: http://localhost:8080/realms/juki
        run: |
          nohup java -jar target/*.jar > spring-oidc.log 2>&1 &
          echo $! > spring-oidc.pid

      - name: Wait for Spring API
        run: npx wait-on -t 180000 http://localhost:8788/actuator/health

      - name: Run Spring OIDC E2E
        env:
          SPRING_OIDC_E2E: "true"
          SPRING_BASE_URL: http://localhost:8788
          KEYCLOAK_TOKEN_URL: http://localhost:8080/realms/juki/protocol/openid-connect/token
          KEYCLOAK_CLIENT_ID: juki-web
        run: npx playwright test -c playwright.spring.config.ts tests/e2e/spring-oidc.spec.ts

      - name: Show logs on failure
        if: failure()
        run: |
          cat apps/api-spring/spring-oidc.log || true
          docker logs resident-keycloak || true

      - name: Stop Spring API
        if: always()
        run: |
          if [ -f apps/api-spring/spring-oidc.pid ]; then
            kill "$(cat apps/api-spring/spring-oidc.pid)" || true
          fi

      - name: Stop containers
        if: always()
        run: docker compose -f apps/api-spring/docker-compose.yaml down -v

      - name: Upload OIDC logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: spring-oidc-e2e-logs
          path: apps/api-spring/spring-oidc.log
          if-no-files-found: ignore
          retention-days: 7

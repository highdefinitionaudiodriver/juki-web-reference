openapi: 3.1.0
info:
  title: 住民記録システム Web版 API
  version: 0.1.0
  description: |
    住民記録システム標準仕様書 第6.1版（令和8年3月25日版 / 自治体システム等標準化検討会）に準拠した
    REST API の設計仕様（ドラフト）。ChromeOS Flex を含む Chromium 系ブラウザからの利用を想定。

    - すべての永続化操作は監査ログに記録される。
    - すべての応答は UTF-8 / application/json。日付は ISO 8601。
    - 認可は OAuth2 / OIDC のスコープ + 属性ベース（ロール + 項目別マスク）。
servers:
  - url: https://{tenant}.juki.example.go.jp/api/v1
    variables:
      tenant: { default: city01 }

tags:
  - { name: auth,         description: 認証 }
  - { name: residents,    description: 住民（管理項目・検索・照会） }
  - { name: transactions, description: 異動（届出/職権/取消） }
  - { name: certificates, description: 証明 }
  - { name: restrictions, description: 抑止設定 }
  - { name: reports,      description: 統計・年報 }
  - { name: euc,          description: EUC（任意抽出） }
  - { name: link,         description: 外部連携（CS/番号/庁内/申請管理） }
  - { name: admin,        description: 管理（ユーザ/ロール/権限/監査） }
  - { name: verify,       description: 改ざん防止検証（公開） }

security:
  - oidc: [residents.read, residents.write, transactions.write, certificates.issue, admin]

paths:

  # ===== 認証 =====
  /auth/login:
    post:
      tags: [auth]
      security: []
      summary: ログイン
      requestBody: { $ref: '#/components/requestBodies/LoginReq' }
      responses:
        '200': { $ref: '#/components/responses/LoginRes' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /auth/logout:
    post: { tags: [auth], summary: ログアウト, responses: { '204': { description: OK } } }
  /me:
    get:
      tags: [auth]
      summary: ログイン中ユーザ情報
      responses:
        '200':
          description: OK
          content:
            application/json: { schema: { $ref: '#/components/schemas/Me' } }

  # ===== 住民 =====
  /residents/search:
    post:
      tags: [residents]
      summary: 住民検索
      description: 抑止対象は権限を持たないユーザには存在自体を隠蔽（404 相当を「該当なし」として返す）
      requestBody:
        required: true
        content:
          application/json: { schema: { $ref: '#/components/schemas/ResidentSearchReq' } }
      responses:
        '200':
          description: OK
          content:
            application/json: { schema: { $ref: '#/components/schemas/PagedResidents' } }
  /residents/{residentId}:
    get:
      tags: [residents]
      summary: 住民詳細（時点照会対応）
      parameters:
        - { name: residentId, in: path, required: true, schema: { type: string } }
        - { name: asOf,       in: query, schema: { type: string, format: date-time } }
        - { name: unmask,     in: query, schema: { type: array, items: { type: string, enum: [my_number, jumin_code] } }, description: 権限必須 }
      responses:
        '200':
          description: OK
          content:
            application/json: { schema: { $ref: '#/components/schemas/Resident' } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [residents]
      summary: 住民更新（単項目修正：軽微）
      requestBody:
        required: true
        content:
          application/json: { schema: { $ref: '#/components/schemas/ResidentPatch' } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Resident' } } } }
  /residents/{residentId}/history:
    get:
      tags: [residents]
      summary: 異動履歴一覧
      parameters:
        - { name: residentId, in: path, required: true, schema: { type: string } }
        - { name: from, in: query, schema: { type: string, format: date } }
        - { name: to,   in: query, schema: { type: string, format: date } }
      responses:
        '200':
          description: OK
          content:
            application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Transaction' } } }
  /residents/{residentId}/notes:
    get:
      tags: [residents]
      summary: 住民への事務メモ一覧（申し送り）
      responses: { '200': { description: OK } }
    post:
      tags: [residents]
      summary: 住民へ事務メモを追加
      requestBody:
        required: true
        content:
          application/json: { schema: { type: object, required: [text], properties: { text: { type: string } } } }
      responses:
        '201': { description: Created }
        '400': { description: Validation error }
        '404': { description: Not found }
  /residents/{residentId}/certificates:
    get:
      tags: [residents]
      summary: 証明書の交付履歴照会（機能 0040084）
      responses:
        '200':
          description: OK
        '404': { description: Not found }
  /residents/{residentId}/household:
    get:
      tags: [residents]
      summary: 同一世帯の世帯員照会（SCR-414）
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  householdId: { type: string }
                  total: { type: integer }
                  members: { type: array, items: { $ref: '#/components/schemas/Resident' } }
        '404': { description: Not found }
  /residents/search/export:
    post:
      tags: [residents]
      summary: 検索結果のCSV出力（機能 0040079・抑止マスク適用・BOM付きUTF-8）
      requestBody:
        required: true
        content:
          application/json: { schema: { $ref: '#/components/schemas/ResidentSearchReq' } }
      responses:
        '200':
          description: CSV
          content:
            text/csv: { schema: { type: string } }
  /residents/{residentId}/alias:
    get:
      tags: [residents]
      summary: 通称・旧氏の一覧（SCR-103）
      responses:
        '200':
          description: OK
          content:
            application/json: { schema: { type: array, items: { $ref: '#/components/schemas/AliasName' } } }
    post:
      tags: [residents]
      summary: 通称・旧氏の登録
      requestBody:
        required: true
        content:
          application/json: { schema: { $ref: '#/components/schemas/AliasName' } }
      responses: { '201': { description: Created } }
  /residents/{residentId}/alias/{aliasId}:
    delete:
      tags: [residents]
      summary: 通称・旧氏の廃止（validTo を設定）
      parameters:
        - { name: aliasId, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: 廃止 }
        '404': { description: Not found }
  /residents/{residentId}/special-permanent:
    get:
      tags: [residents]
      summary: 特別永住者証明書の取得（SCR-802）
      responses:
        '200':
          description: OK
          content:
            application/json: { schema: { $ref: '#/components/schemas/SpecialPermanentCert' } }
    put:
      tags: [residents]
      summary: 特別永住者証明書の交付・更新。満了日はサーバ算出（16歳未満は16歳誕生日／以上は交付日+7年）。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [certNumber]
              properties:
                certNumber: { type: string }
                issuedDate: { type: string, format: date }
                note: { type: string }
      responses:
        '200': { description: 交付/更新 }
        '400': { description: Validation error }
  /special-permanent/expiring:
    get:
      tags: [residents]
      summary: 特別永住者証明書 有効期間満了予定一覧
      parameters:
        - { name: days, in: query, schema: { type: integer, default: 90 } }
      responses:
        '200': { description: OK }

  # ===== 異動 =====
  /transactions/in:
    post:
      tags: [transactions]
      summary: 転入届の受付・反映
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/MoveInReq' } } }
      responses:
        '201':
          description: Created
          content: { application/json: { schema: { $ref: '#/components/schemas/Transaction' } } }
  /transactions/out:
    post:
      tags: [transactions]
      summary: 転出届
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/MoveOutReq' } } } }
      responses:
        '201':
          description: Created（転出証明書発行情報を含む）
          content: { application/json: { schema: { $ref: '#/components/schemas/TransactionWithCertificate' } } }
  /transactions/move:
    post:
      tags: [transactions]
      summary: 転居届
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/MoveInternalReq' } } } }
      responses: { '201': { description: Created } }
  /transactions/household:
    post:
      tags: [transactions]
      summary: 世帯変更（世帯主変更・分離・合併）
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/HouseholdChangeReq' } } } }
      responses: { '201': { description: Created } }
  /transactions/birth:
    post: { tags: [transactions], summary: 出生連動（戸籍通知）, responses: { '201': { description: Created } } }
  /transactions/death:
    post: { tags: [transactions], summary: 死亡連動（戸籍通知）, responses: { '201': { description: Created } } }
  /transactions/koseki:
    post: { tags: [transactions], summary: 戸籍異動連動（婚姻/離婚等）, responses: { '201': { description: Created } } }
  /transactions/official:
    post:
      tags: [transactions]
      summary: 職権異動 起票
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/OfficialTxReq' } } } }
      responses: { '201': { description: Created } }
  /transactions/{txId}/approve:
    post:
      tags: [transactions]
      summary: 職権異動 決裁（承認/差戻/却下）
      parameters: [ { name: txId, in: path, required: true, schema: { type: string } } ]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/ApprovalReq' } } }
      responses: { '200': { description: OK } }
  /transactions/cancel:
    post:
      tags: [transactions]
      summary: 異動取消（標準仕様 4.6）
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CancelReq' } } } }
      responses: { '201': { description: Created } }

  # 住民票コード / 個人番号 / 外国人在留
  /codes/jumin:
    post:
      tags: [transactions]
      summary: 住民票コード 付番/変更/修正
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/JuminCodeReq' } } } }
      responses:
        '201':
          description: Created（通知票 0010009/0010011 を同時発行）
          content: { application/json: { schema: { $ref: '#/components/schemas/CodeIssueResult' } } }
  /codes/mynumber:
    post:
      tags: [transactions]
      summary: 個人番号 付番/変更/修正
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/MyNumberReq' } } } }
      responses:
        '201':
          description: Created（通知票 0010010/0010011 を同時発行）
          content: { application/json: { schema: { $ref: '#/components/schemas/CodeIssueResult' } } }
  /residents/{residentId}/foreigner:
    put:
      tags: [transactions]
      summary: 外国人住民 在留情報更新（4.5）
      parameters: [ { name: residentId, in: path, required: true, schema: { type: string } } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ForeignerInfo' } } } }
      responses:
        '200':
          description: OK
          content: { application/json: { schema: { $ref: '#/components/schemas/ForeignerUpdateResult' } } }

  # ===== 証明 =====
  /certificates/bulk:
    post:
      tags: [certificate]
      summary: 証明書の連件交付（複数宛名番号へ一括発行）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [residentIds]
              properties:
                residentIds: { type: array, items: { type: string } }
                formId: { type: string }
                usageText: { type: string }
      responses:
        '201': { description: 一括発行結果(issued/skipped) }
        '400': { description: Validation error }
  /certificates/jumin:
    post:
      tags: [certificates]
      summary: 住民票の写し発行（0010001/0010003）
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CertificateReq' } } } }
      responses:
        '201':
          description: Created（PDFリンクと改ざん防止トークン）
          content: { application/json: { schema: { $ref: '#/components/schemas/CertificateIssue' } } }
  /certificates/items:
    post: { tags: [certificates], summary: 住民票記載事項証明書（0010002）, responses: { '201': { description: Created } } }
  /certificates/removed:
    post: { tags: [certificates], summary: 除票の写し（0010004）, responses: { '201': { description: Created } } }
  /certificates/inspection:
    post: { tags: [certificates], summary: 一部の写し（閲覧用・0010005）, responses: { '201': { description: Created } } }
  /certificates/out:
    post: { tags: [certificates], summary: 転出証明書（0010007/0010008）, responses: { '201': { description: Created } } }
  /certificates/{issueId}/pdf:
    get:
      tags: [certificates]
      summary: 発行済証明書PDF取得
      description: PDF/A生成サービス接続前は簡易PDFを返す。正式実装では帳票テンプレートからPDF/A-2bを生成する。
      parameters:
        - { name: issueId, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: PDF
          content:
            application/pdf:
              schema: { type: string, format: binary }
        '404': { $ref: '#/components/responses/NotFound' }
  /verify/{token}:
    get:
      tags: [verify]
      security: []
      summary: 改ざん防止コード検証（外部公開）
      parameters: [ { name: token, in: path, required: true, schema: { type: string } } ]
      responses:
        '200':
          description: OK（発行メタ情報のみ）
          content: { application/json: { schema: { $ref: '#/components/schemas/VerifyResult' } } }
        '404': { $ref: '#/components/responses/NotFound' }

  # ===== 抑止 =====
  /restrictions:
    post:
      tags: [restrictions]
      summary: 抑止登録（DV等支援措置）
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/Restriction' } } } }
      responses: { '201': { description: Created } }
  /restrictions/{id}:
    delete:
      tags: [restrictions]
      summary: 抑止解除（解除権限ロールのみ）
      parameters: [ { name: id, in: path, required: true, schema: { type: string } } ]
      responses: { '204': { description: OK } }

  # ===== 統計 / EUC =====
  /reports/annual:
    post:
      tags: [reports]
      summary: 住基年報（標準仕様 20.6）
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ReportReq' } } } }
      responses:
        '202':
          description: 受付（非同期）
          content: { application/json: { schema: { $ref: '#/components/schemas/AsyncJob' } } }
  /reports/population:
    post: { tags: [reports], summary: 人口動態, responses: { '202': { description: 受付 } } }
  /reports/foreigner-expiring:
    post:
      tags: [reports]
      summary: 在留期間満了 30 日前抽出・通知票発行（0010012）
      requestBody: { required: false, content: { application/json: { schema: { $ref: '#/components/schemas/ForeignerExpiryReportReq' } } } }
      responses:
        '202':
          description: 受付（対象者へ 0010012 を発行）
          content: { application/json: { schema: { $ref: '#/components/schemas/ForeignerExpiryJob' } } }
  /reports/{jobId}:
    get:
      tags: [reports]
      summary: 集計ジョブ状態
      parameters: [ { name: jobId, in: path, required: true, schema: { type: string } } ]
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/AsyncJob' } } } }
  /euc:
    get:
      tags: [euc]
      summary: EUC 依頼一覧（QUEUED 承認待ち 等）
      description: |
        status クエリで状態絞り込み（QUEUED / DONE / FAILED）。未指定は直近 100 件全件。
        承認 UI が承認待ちジョブ一覧を取得して、承認/却下を完結させるための endpoint。
      parameters:
        - { name: status, in: query, required: false, schema: { type: string, enum: [QUEUED, DONE, FAILED] } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    jobId: { type: string }
                    status: { type: string }
                    requesterUserId: { type: string, nullable: true }
                    requestedAt: { type: string, format: date-time, nullable: true }
                    outputFields: { type: array, items: { type: string } }
                    includeMyNumber: { type: boolean }
                    resultUrl: { type: string, nullable: true }
                    requiredApprovals: { type: integer }
                    approvedCount: { type: integer }
  /euc/query:
    post:
      tags: [euc]
      summary: EUC（任意抽出）
      description: 個人番号が出力対象に含まれる場合は二段階承認、二段階承認不要の結果は ZIP 配信。
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/EucQueryReq' } } } }
      responses:
        '202': { description: 受付, content: { application/json: { schema: { $ref: '#/components/schemas/AsyncJob' } } } }
  /euc/{jobId}/result.zip:
    get:
      tags: [euc]
      summary: EUC 抽出結果 ZIP 取得（AES-256 パスワード付）
      description: |
        二段階承認不要の DONE ジョブのみ CSV を AES-256 パスワード付 ZIP で返す。
        個人番号を含む QUEUED ジョブは 409。
        ダウンロード毎にランダムパスワードを生成し、`X-Euc-Password` ヘッダに平文で
        返却する（漏洩リスクのため TLS 必須）。SHA-256 ハッシュは
        `X-Euc-Password-Hash` および `report_request.result_url` の
        `?passwordHash=...` に記録される（監査用）。
      parameters: [ { name: jobId, in: path, required: true, schema: { type: string, pattern: '^EUC-[0-9]+$' } } ]
      responses:
        '200':
          description: AES-256 暗号化 ZIP
          headers:
            X-Euc-Password:
              schema: { type: string }
              description: ZIP の復号パスワード（平文）。漏洩防止のため別経路通知への置換を推奨。
            X-Euc-Password-Hash:
              schema: { type: string, pattern: '^[0-9a-f]{64}$' }
              description: パスワードの SHA-256 ハッシュ（hex 64 文字）。監査用。
          content:
            application/zip:
              schema: { type: string, format: binary }
        '404': { description: ジョブなし }
        '409': { description: 二段階承認待ちまたは未完了 }
  /euc/{jobId}/approve:
    post:
      tags: [euc]
      summary: EUC 二段階承認
      description: 個人番号を含む QUEUED ジョブを承認して DONE に進める、または却下して FAILED にする。承認メタデータは `report_request.params.approval` に保存する。
      parameters: [ { name: jobId, in: path, required: true, schema: { type: string, pattern: '^EUC-[0-9]+$' } } ]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                action: { type: string, enum: [APPROVE, REJECT], default: APPROVE }
                comment: { type: string, nullable: true }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/AsyncJob' } } } }
        '400': { description: action または保存済み filters が不正 }
        '404': { description: ジョブなし }
        '409': { description: 承認待ちではない }

  # ===== 連携 =====
  /link/cs/inbound:
    post:
      tags: [link]
      summary: 住基ネットCS受信
      responses:
        '202': { description: 受付, content: { application/json: { schema: { $ref: '#/components/schemas/LinkAcceptResult' } } } }
  /link/number/inbound:
    post:
      tags: [link]
      summary: 番号連携受信
      responses:
        '202': { description: 受付, content: { application/json: { schema: { $ref: '#/components/schemas/LinkAcceptResult' } } } }
  /link/internal/{partner}:
    post:
      tags: [link]
      summary: 庁内他業務（税/国保/選挙 等）
      parameters: [ { name: partner, in: path, required: true, schema: { type: string, enum: [tax, insurance, election, koseki, application] } } ]
      requestBody: { required: false, content: { application/json: { schema: { $ref: '#/components/schemas/KosekiLinkReq' } } } }
      responses:
        '201':
          description: 戸籍連動は異動反映済
          content: { application/json: { schema: { $ref: '#/components/schemas/LinkApplyResult' } } }
        '202':
          description: その他庁内連携は受付
          content: { application/json: { schema: { $ref: '#/components/schemas/LinkAcceptResult' } } }
  /link/application/inbound:
    post:
      tags: [link]
      summary: 申請管理システム受信（市民ポータル等からのインバウンド申請。受付簿に取り込む）
      responses:
        '202': { description: 受付, content: { application/json: { schema: { $ref: '#/components/schemas/LinkAcceptResult' } } } }
  /link/applications:
    get:
      tags: [link]
      summary: オンライン申請 受付簿の一覧（職員用, VIEW）
      responses: { '200': { description: OK }, '403': { description: Forbidden } }
  /link/applications/{id}/status:
    post:
      tags: [link]
      summary: オンライン申請の処理状況更新（RECEIVED/PROCESSING/COMPLETED/REJECTED, VIEW）
      responses: { '200': { description: OK }, '400': { description: Validation Error }, '404': { description: Not Found } }

  # ===== 管理 =====
  /admin/users:
    get:  { tags: [admin], summary: ユーザ一覧, responses: { '200': { description: OK } } }
    post: { tags: [admin], summary: ユーザ作成, responses: { '201': { description: Created } } }
  /admin/roles:
    get:  { tags: [admin], summary: ロール一覧, responses: { '200': { description: OK } } }
    post: { tags: [admin], summary: ロール作成, responses: { '201': { description: Created } } }
  /admin/permissions:
    post: { tags: [admin], summary: 権限マトリクス更新, responses: { '200': { description: OK } } }
  /system-info:
    get:
      tags: [admin]
      summary: システム情報（Node版/稼働時間/データ件数等, 運用・監視用）
      responses: { '200': { description: OK }, '403': { description: Forbidden } }
  /overview:
    get:
      tags: [admin]
      summary: ダッシュボード 主要指標の集約（SCR-002）
      responses: { '200': { description: OK } }
  /announcements:
    get:
      tags: [admin]
      summary: お知らせ一覧（運用周知）
      responses: { '200': { description: OK } }
    post:
      tags: [admin]
      summary: お知らせ登録（ADMIN, level=info/warning/critical）
      responses: { '201': { description: Created }, '400': { description: Validation error }, '403': { description: Forbidden } }
  /announcements/{id}:
    delete:
      tags: [admin]
      summary: お知らせ削除（ADMIN）
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses: { '204': { description: Deleted }, '404': { description: Not found } }
  /batch-jobs:
    get:
      tags: [admin]
      summary: バッチ定義一覧・実行履歴（標準仕様書 9 バッチ）
      responses: { '200': { description: OK } }
  /batch-jobs/{type}/run:
    post:
      tags: [admin]
      summary: バッチ実行（CS取込/整合性確認/年報集計/満了抽出 等）
      parameters:
        - { name: type, in: path, required: true, schema: { type: string } }
      responses: { '202': { description: Accepted }, '404': { description: Unknown batch type } }
  /euc-templates:
    get:
      tags: [admin]
      summary: EUC抽出テンプレート一覧（SCR-A01）
      responses: { '200': { description: OK } }
    post:
      tags: [admin]
      summary: EUC抽出テンプレート作成。個人番号含む場合は二人承認フラグを付与。
      responses: { '201': { description: Created }, '400': { description: Validation error } }
  /euc-templates/{id}/run:
    post:
      tags: [admin]
      summary: 保存テンプレートからEUC抽出を実行。機微情報含むと二人承認(QUEUED)。
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses: { '202': { description: Accepted }, '404': { description: Not found } }
  /euc-templates/{id}:
    delete:
      tags: [admin]
      summary: EUC抽出テンプレート削除
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses: { '204': { description: Deleted }, '404': { description: Not found } }
  /alert-rules:
    get:
      tags: [admin]
      summary: エラー・アラート検知ルール取得（SCR-A04）
      responses: { '200': { description: OK } }
    put:
      tags: [admin]
      summary: アラート検知ルール更新（ADMIN/RESTRICTION_MANAGE）
      responses: { '200': { description: Updated }, '403': { description: Forbidden } }
  /alerts:
    get:
      tags: [admin]
      summary: アクセスログ分析アラート一覧（深夜アクセス・大量検索）
      responses: { '200': { description: OK } }
  /export-all:
    get:
      tags: [admin]
      summary: 契約終了時データ提供（全業務データの一括エクスポート, ADMIN）
      responses:
        '200':
          description: Full data bundle (JSON)
        '403': { description: Forbidden }
  /audit/export:
    get:
      tags: [admin]
      summary: 監査ログのCSV出力（操作ログ提出用・BOM付きUTF-8）
      responses:
        '200':
          description: CSV
          content:
            text/csv: { schema: { type: string } }
        '403': { description: Forbidden }
  /audit:
    get:
      tags: [admin]
      summary: 監査ログ参照
      parameters:
        - { name: from, in: query, schema: { type: string, format: date-time } }
        - { name: to,   in: query, schema: { type: string, format: date-time } }
        - { name: userId, in: query, schema: { type: string } }
        - { name: residentId, in: query, schema: { type: string } }
        - { name: action, in: query, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json: { schema: { type: array, items: { $ref: '#/components/schemas/AuditLog' } } }

  /notify/registrations:
    get:
      tags: [notify]
      summary: 本人通知制度 登録一覧（標準仕様書 8.1 / SCR-801）
      responses:
        '200':
          description: OK
          content:
            application/json: { schema: { type: array, items: { $ref: '#/components/schemas/NotifyRegistration' } } }
    post:
      tags: [notify]
      summary: 本人通知制度 事前登録
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [residentId]
              properties:
                residentId: { type: string }
                years: { type: integer, default: 3 }
                note: { type: string }
      responses:
        '201':
          description: 登録
          content:
            application/json: { schema: { $ref: '#/components/schemas/NotifyRegistration' } }
        '409': { description: 既に登録済み }
  /notify/registrations/{registrationId}:
    delete:
      tags: [notify]
      summary: 本人通知制度 登録廃止
      parameters:
        - { name: registrationId, in: path, required: true, schema: { type: string } }
      responses:
        '204': { description: 廃止 }
        '404': { description: 未登録 }
  /notify:
    get:
      tags: [notify]
      summary: 本人通知 発出記録一覧
      responses:
        '200':
          description: OK
          content:
            application/json: { schema: { type: array, items: { $ref: '#/components/schemas/HonninNotification' } } }

  /certificates/conveni/status:
    get:
      tags: [certificate]
      summary: コンビニ交付 J-LIS 連携状態（SCR-507）
      responses:
        '200':
          description: OK
          content:
            application/json: { schema: { $ref: '#/components/schemas/ConveniStatus' } }
  /certificates/conveni:
    get:
      tags: [certificate]
      summary: コンビニ交付 履歴一覧
      responses:
        '200':
          description: OK
          content:
            application/json: { schema: { type: array, items: { $ref: '#/components/schemas/ConveniRequest' } } }
    post:
      tags: [certificate]
      summary: コンビニ交付要求受領（J-LIS 中間サーバ連携）。抑止対象は REFUSED。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [residentId]
              properties:
                residentId: { type: string }
                formId: { type: string }
                storeCode: { type: string }
                cardSerial: { type: string }
      responses:
        '201':
          description: 交付（ISSUED）
          content:
            application/json: { schema: { $ref: '#/components/schemas/ConveniRequest' } }
        '200':
          description: 利用停止/処理中（REFUSED 等）
          content:
            application/json: { schema: { $ref: '#/components/schemas/ConveniRequest' } }
        '404': { description: 対象住民なし }

components:

  securitySchemes:
    oidc:
      type: openIdConnect
      openIdConnectUrl: https://idp.example.go.jp/.well-known/openid-configuration

  requestBodies:
    LoginReq:
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              employeeId: { type: string }
              password:   { type: string, format: password }
              webauthn:   { type: object, description: WebAuthn アサーション（任意） }

  responses:
    LoginRes:
      description: OK
      content:
        application/json:
          schema:
            type: object
            properties:
              accessToken: { type: string }
              expiresIn:   { type: integer }
              me:          { $ref: '#/components/schemas/Me' }
    Unauthorized: { description: 認証エラー, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    Forbidden:    { description: 権限エラー, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    NotFound:     { description: 該当なし, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

  schemas:

    Error:
      type: object
      required: [code, message]
      properties:
        code:    { type: string, example: VALIDATION_ERROR }
        message: { type: string }
        details: { type: array, items: { type: object } }

    Me:
      type: object
      properties:
        userId:     { type: string }
        fullName:   { type: string }
        department: { type: string }
        roles:      { type: array, items: { type: string } }

    Resident:
      type: object
      properties:
        residentId:        { type: string, description: 宛名番号 }
        familyNameKanji:   { type: string }
        givenNameKanji:    { type: string }
        familyNameKana:    { type: string }
        givenNameKana:     { type: string }
        birthDate:         { type: string, format: date }
        sex:               { type: string, enum: [M, F, U] }
        addressCode:       { type: string }
        addressText:       { type: string }
        householdId:       { type: string }
        relationToHead:    { type: string }
        movedInDate:       { type: string, format: date }
        movedOutDate:      { type: string, format: date, nullable: true }
        juminCode:         { type: string, description: 'マスク済 or 平文（権限による）' }
        myNumber:          { type: string, description: 'マスク済 or 平文（権限による）' }
        nationality:       { type: string, nullable: true }
        foreigner:         { $ref: '#/components/schemas/ForeignerInfo' }
        alias:             { type: array, items: { $ref: '#/components/schemas/AliasName' } }
        restrictions:      { type: array, items: { $ref: '#/components/schemas/Restriction' } }
        validFrom:         { type: string, format: date-time }
        validTo:           { type: string, format: date-time, nullable: true }

    ResidentPatch:
      type: object
      properties:
        addressText:  { type: string }
        addressCode:  { type: string }
        reasonCode:   { type: string }
        eventDate:    { type: string, format: date }

    ResidentSearchReq:
      type: object
      properties:
        name:        { type: string }
        kana:        { type: string }
        birthDate:   { type: string, format: date }
        sex:         { type: string, enum: [M, F] }
        residentId:  { type: string }
        juminCode:   { type: string }
        myNumber:    { type: string, description: 権限必須 }
        address:     { type: string }
        householdHeadOnly: { type: boolean }
        foreignerOnly:     { type: boolean }
        includeRemoved:    { type: boolean, default: false }
        page:        { type: integer, default: 1 }
        size:        { type: integer, default: 50 }

    PagedResidents:
      type: object
      properties:
        total: { type: integer }
        page:  { type: integer }
        size:  { type: integer }
        items: { type: array, items: { $ref: '#/components/schemas/Resident' } }

    ForeignerInfo:
      type: object
      required: [residencePeriodEnd]
      properties:
        residenceStatus:        { type: string }
        residencePeriodEnd:     { type: string, format: date }
        passportNo:             { type: string }
        nationalityFull:        { type: string }
        aliasKanji:             { type: string, description: 通称 }
        specialPermanentResident: { type: boolean }

    ForeignerUpdateResult:
      allOf:
        - $ref: '#/components/schemas/ForeignerInfo'
        - type: object
          properties:
            residentId: { type: string }
            expiresWithin30Days: { type: boolean }

    SpecialPermanentCert:
      type: object
      description: 特別永住者証明書（SCR-802）
      properties:
        certNumber: { type: string }
        issuedDate: { type: string, format: date }
        expiryDate: { type: string, format: date }
        note:       { type: string }
    AliasName:
      type: object
      properties:
        aliasId:   { type: string }
        kind:      { type: string, enum: [ALIAS, FORMER_FAMILY] }
        valueKanji: { type: string }
        valueKana: { type: string }
        validFrom: { type: string, format: date }
        validTo:   { type: string, format: date, nullable: true }

    Restriction:
      type: object
      properties:
        id:          { type: string, readOnly: true }
        residentId:  { type: string }
        category:    { type: string, enum: [DV, STALKER, CHILD_ABUSE, OTHER] }
        startDate:   { type: string, format: date }
        endDate:     { type: string, format: date }
        scope:       { type: string, enum: [SELF, HOUSEHOLD] }
        releaseRole: { type: string }
        note:        { type: string }

    Transaction:
      type: object
      properties:
        transactionId:        { type: string }
        residentId:           { type: string }
        householdId:          { type: string }
        typeCode:             { type: string, description: 'IN/OUT/MOVE/HH/BIRTH/DEATH/OFFICIAL/CANCEL ...' }
        reasonCode:           { type: string }
        eventDate:            { type: string, format: date }
        processedDate:        { type: string, format: date }
        receiverOffice:       { type: string }
        status:               { type: string, enum: [DRAFT, REVIEW, APPROVED, APPLIED, CANCELLED] }
        parentTransactionId:  { type: string, nullable: true }
        items:                { type: array, items: { $ref: '#/components/schemas/TransactionItem' } }

    TransactionItem:
      type: object
      properties:
        field:       { type: string }
        valueBefore: { type: string, nullable: true }
        valueAfter:  { type: string, nullable: true }

    MoveInReq:
      type: object
      required: [eventDate, members]
      properties:
        eventDate:           { type: string, format: date }
        previousAddress:     { type: string }
        moveOutCertNo:       { type: string }
        members:             { type: array, items: { $ref: '#/components/schemas/MoveMember' } }
    MoveMember:
      type: object
      properties:
        familyNameKanji: { type: string }
        givenNameKanji:  { type: string }
        familyNameKana:  { type: string }
        givenNameKana:   { type: string }
        birthDate:       { type: string, format: date }
        sex:             { type: string, enum: [M, F, U] }
        relationToHead:  { type: string }
        myNumber:        { type: string }
        foreigner:       { $ref: '#/components/schemas/ForeignerInfo' }

    MoveOutReq:
      type: object
      required: [eventDate, members, newAddress]
      properties:
        eventDate:    { type: string, format: date }
        newAddress:   { type: string }
        newAddressCode: { type: string }
        reasonCode:   { type: string }
        members:      { type: array, items: { type: string, description: residentId } }

    MoveInternalReq:
      type: object
      required: [eventDate, householdId, newAddress]
      properties:
        eventDate:   { type: string, format: date }
        householdId: { type: string }
        newAddress:  { type: string }
        newAddressCode: { type: string }

    HouseholdChangeReq:
      type: object
      properties:
        operation:    { type: string, enum: [HEAD_CHANGE, SPLIT, MERGE] }
        householdId:  { type: string }
        newHeadResidentId: { type: string }
        eventDate:    { type: string, format: date }
        details:      { type: object }

    OfficialTxReq:
      type: object
      required: [residentId, reasonCode, eventDate, content]
      properties:
        residentId:  { type: string }
        reasonCode:  { type: string, enum: [OFFICIAL_WRITE, OFFICIAL_FIX, OFFICIAL_DELETE] }
        eventDate:   { type: string, format: date }
        legalBasis:  { type: string }
        content:     { type: string }
        attachments: { type: array, items: { type: string, format: uri } }
        approvalRoute: { type: array, items: { type: string, description: roleId } }

    ApprovalReq:
      type: object
      properties:
        action:   { type: string, enum: [APPROVE, REMAND, REJECT, CONDITIONAL] }
        comment:  { type: string }

    CancelReq:
      type: object
      required: [transactionId, reason]
      properties:
        transactionId: { type: string }
        reason:        { type: string }

    JuminCodeReq:
      type: object
      properties:
        residentId: { type: string }
        operation:  { type: string, enum: [ISSUE, CHANGE, FIX] }
        code:       { type: string, description: 'CHANGE/FIX 時の新コード' }

    MyNumberReq:
      type: object
      properties:
        residentId: { type: string }
        operation:  { type: string, enum: [ISSUE, CHANGE, FIX] }
        number:     { type: string }

    CertificateReq:
      type: object
      required: [residentId, formId]
      properties:
        residentId:         { type: string }
        formId:             { type: string, enum: ["0010001", "0010002", "0010003", "0010004", "0010005", "0010007", "0010008", "0010009", "0010010", "0010011", "0010012"] }
        scope:              { type: string, enum: [SELF, HOUSEHOLD, MEMBERS] }
        showJuminCode:      { type: boolean }
        showMyNumber:       { type: boolean }
        showKoseki:         { type: boolean }
        showHeadAndRelation: { type: boolean }
        copies:             { type: integer }
        usageText:          { type: string }

    CertificateIssue:
      type: object
      properties:
        issueId:     { type: string }
        residentId:  { type: string }
        formId:      { type: string }
        copies:      { type: integer }
        fee:         { type: integer }
        verifyToken: { type: string }
        pdfUrl:      { type: string, format: uri }
        issuedAt:    { type: string, format: date-time }
        channel:     { type: string, enum: [WINDOW, CVS, ONLINE] }

    CodeIssueResult:
      type: object
      properties:
        residentId:   { type: string }
        operation:    { type: string, enum: [ISSUE, CHANGE, FIX] }
        juminCode:    { type: string, description: 住民票コード処理時のみ }
        myNumber:     { type: string, description: 個人番号処理時のみ }
        certificate:  { $ref: '#/components/schemas/CertificateIssue' }

    VerifyResult:
      type: object
      properties:
        valid:       { type: boolean }
        formId:      { type: string }
        issuedAt:    { type: string, format: date-time }
        issuerOffice: { type: string }

    TransactionWithCertificate:
      allOf:
        - $ref: '#/components/schemas/Transaction'
        - type: object
          properties:
            certificate: { $ref: '#/components/schemas/CertificateIssue' }

    ReportReq:
      type: object
      properties:
        templateId: { type: string }
        fiscalYear: { type: integer }
        format:     { type: string, enum: [XLSX, PDF], default: XLSX }
        params:     { type: object }

    EucQueryReq:
      type: object
      properties:
        templateId: { type: string, nullable: true }
        sql:        { type: string, description: テンプレ ID なしの場合のみ }
        filters:
          type: object
          description: Spring 実装では許可リスト化した条件のみ SQL パラメータとして適用する。
          additionalProperties: false
          properties:
            residentId: { type: string }
            residentIdPrefix: { type: string }
            householdId: { type: string }
            sex: { type: string, enum: [M, F, U] }
            addressCode: { type: string }
            addressTextContains: { type: string }
            nameContains: { type: string }
            nationality: { type: string }
            birthDateFrom: { type: string, format: date }
            birthDateTo: { type: string, format: date }
            movedInDateFrom: { type: string, format: date }
            movedInDateTo: { type: string, format: date }
        outputFields:
          type: array
          items:
            type: string
            enum: [residentId, name, nameKana, addressText, addressCode, birthDate, sex, nationality, movedInDate, householdId, myNumber]
        format:     { type: string, enum: [CSV, XLSX], default: CSV }
        includeMyNumber: { type: boolean, default: false }

    AsyncJob:
      type: object
      properties:
        jobId:     { type: string }
        status:    { type: string, enum: [QUEUED, RUNNING, DONE, FAILED] }
        progress:  { type: integer, minimum: 0, maximum: 100 }
        resultUrl: { type: string, format: uri, nullable: true }
        error:     { type: string, nullable: true }
        requiredApprovals: { type: integer }
        approvedCount:     { type: integer }

    ForeignerExpiryReportReq:
      type: object
      properties:
        baseDate: { type: string, format: date }
        days:     { type: integer, default: 30 }

    ForeignerExpiryJob:
      allOf:
        - $ref: '#/components/schemas/AsyncJob'
        - type: object
          properties:
            baseDate:    { type: string, format: date }
            days:        { type: integer }
            targetCount: { type: integer }
            issuedCount: { type: integer }
            formId:      { type: string, enum: ["0010012"] }

    KosekiLinkReq:
      type: object
      properties:
        noticeType: { type: string, enum: [BIRTH, DEATH, MARRIAGE, DIVORCE, ADOPTION] }
        kosekiNoticeId: { type: string }
        residentId: { type: string }
        parentResidentId: { type: string }
        eventDate: { type: string, format: date }
        familyNameKanji: { type: string }
        givenNameKanji: { type: string }
        familyNameKana: { type: string }
        givenNameKana: { type: string }
        sex: { type: string, enum: [M, F, U] }
        relationToHead: { type: string }
        newFamilyNameKanji: { type: string }
        newFamilyNameKana: { type: string }

    LinkResultBase:
      type: object
      properties:
        eventId: { type: string }
        partnerId: { type: string }
        receivedAt: { type: string, format: date-time }

    LinkAcceptResult:
      allOf:
        - $ref: '#/components/schemas/LinkResultBase'
        - type: object
          properties:
            status: { type: string, enum: [ACCEPTED] }

    LinkApplyResult:
      allOf:
        - $ref: '#/components/schemas/LinkResultBase'
        - type: object
          properties:
            status: { type: string, enum: [APPLIED] }
            transactionId: { type: string }
            transaction: { $ref: '#/components/schemas/Transaction' }

    AuditLog:
      type: object
      properties:
        logId:        { type: integer }
        userId:       { type: string }
        ip:           { type: string }
        action:       { type: string }
        resourceType: { type: string }
        resourceId:   { type: string }
        occurredAt:   { type: string, format: date-time }
        details:      { type: object, additionalProperties: true }
    NotifyRegistration:
      type: object
      description: 本人通知制度の事前登録（標準仕様書 8.1）
      properties:
        registrationId: { type: string }
        residentId:     { type: string }
        registeredAt:   { type: string, format: date-time }
        expiresAt:      { type: string, format: date }
        status:         { type: string, enum: [ACTIVE, INACTIVE] }
